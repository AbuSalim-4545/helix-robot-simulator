<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>iMRP500 Remote Drive</title>
    <!-- MQTT — local vendor copy (offline-safe), CDN fallback -->
    <script src="../../vendor/mqtt.min.js"></script>
    <script>if (typeof mqtt === 'undefined') { const s = document.createElement('script'); s.src = 'https://unpkg.com/mqtt/dist/mqtt.min.js'; document.head.appendChild(s); }</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f1117; color: #e0e0e0;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; overflow: hidden;
    touch-action: none;
  }
  .header {
    padding: 12px 20px; width: 100%; text-align: center;
    background: #1a1d27; border-bottom: 1px solid #2a2d3a;
  }
  .header h1 { font-size: 18px; font-weight: 600; }
  .status-bar {
    display: flex; gap: 16px; justify-content: center;
    padding: 8px; font-size: 13px;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    display: inline-block; margin-right: 4px;
  }
  .dot-red { background: #ef4444; }
  .dot-green { background: #22c55e; }
  .dot-yellow { background: #eab308; }

  .controls {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    padding: 16px; width: 100%; max-width: 500px;
  }

  .speed-display {
    font-size: 14px; color: #94a3b8;
    background: #1a1d27; padding: 8px 20px; border-radius: 8px;
    display: flex; gap: 24px;
  }
  .speed-display span { font-family: 'Courier New', monospace; color: #60a5fa; }

  .joystick-container {
    width: 280px; height: 280px;
    background: radial-gradient(circle, #1e2130 0%, #151722 100%);
    border-radius: 50%; border: 2px solid #2a2d3a;
    position: relative; touch-action: none;
  }
  .joystick-knob {
    width: 70px; height: 70px;
    background: radial-gradient(circle at 30% 30%, #4a7dff, #2557d6);
    border-radius: 50%; position: absolute;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    box-shadow: 0 0 20px rgba(74, 125, 255, 0.3);
    transition: box-shadow 0.1s;
    cursor: grab;
  }
  .joystick-knob.active {
    box-shadow: 0 0 30px rgba(74, 125, 255, 0.6);
    cursor: grabbing;
  }
  .joystick-crosshair {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 90%; height: 90%; pointer-events: none;
  }
  .joystick-crosshair::before, .joystick-crosshair::after {
    content: ''; position: absolute; background: #2a2d3a;
  }
  .joystick-crosshair::before { width: 1px; height: 100%; left: 50%; }
  .joystick-crosshair::after { width: 100%; height: 1px; top: 50%; }

  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

  .btn {
    padding: 12px 24px; border: 1px solid #2a2d3a;
    border-radius: 8px; background: #1a1d27; color: #e0e0e0;
    font-size: 14px; cursor: pointer; transition: all 0.15s;
    user-select: none; -webkit-user-select: none;
  }
  .btn:active, .btn.active { background: #2557d6; border-color: #4a7dff; }
  .btn-stop {
    background: #7f1d1d; border-color: #ef4444; color: #fca5a5;
    font-weight: 700; padding: 14px 36px; font-size: 16px;
  }
  .btn-stop:active { background: #ef4444; color: #fff; }

  .slider-row {
    display: flex; align-items: center; gap: 12px;
    background: #1a1d27; padding: 10px 16px; border-radius: 8px; width: 100%;
  }
  .slider-row label { font-size: 13px; color: #94a3b8; min-width: 80px; }
  .slider-row input[type=range] { flex: 1; accent-color: #4a7dff; }
  .slider-row .val { font-family: monospace; color: #60a5fa; min-width: 40px; text-align: right; }

  .cam-container {
    width: 100%; max-width: 500px;
    background: #111318; border-radius: 8px;
    overflow: hidden; position: relative;
    border: 1px solid #2a2d3a;
  }
  .cam-container img {
    width: 100%; display: block;
    image-rendering: auto;
  }
  .cam-label {
    position: absolute; top: 6px; left: 8px;
    font-size: 11px; color: #94a3b8;
    background: rgba(0,0,0,0.6); padding: 2px 8px;
    border-radius: 4px;
  }
  .cam-fps {
    position: absolute; top: 6px; right: 8px;
    font-size: 11px; color: #22c55e;
    background: rgba(0,0,0,0.6); padding: 2px 8px;
    border-radius: 4px;
  }
  .cam-toggle {
    position: absolute; bottom: 6px; right: 8px;
    font-size: 11px; cursor: pointer;
    background: rgba(0,0,0,0.7); border: 1px solid #2a2d3a;
    color: #e0e0e0; padding: 3px 10px; border-radius: 4px;
    user-select: none;
  }
  .cam-toggle.paused { border-color: #ef4444; color: #fca5a5; }
  .cam-paused-overlay {
    display: none; position: absolute; inset: 0;
    background: rgba(0,0,0,0.55);
    align-items: center; justify-content: center;
    font-size: 13px; color: #94a3b8; letter-spacing: 2px;
  }
  .cam-paused-overlay.visible { display: flex; }

  .log {
    width: 100%; max-width: 500px; padding: 8px 16px;
    font-size: 11px; color: #64748b; max-height: 60px;
    overflow-y: auto; text-align: center;
  }

  @media (max-height: 600px) {
    .joystick-container { width: 200px; height: 200px; }
    .joystick-knob { width: 50px; height: 50px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>iMRP500 Remote Drive</h1>
  <div class="status-bar">
    <div><span class="status-dot dot-red" id="dotMqtt"></span> MQTT: <span id="mqttStatus">connecting...</span></div>
  </div>
</div>

<div class="controls">
  <div class="cam-container" id="camBox">
    <img id="camImg" src="" alt="Waiting for camera...">
    <div class="cam-label">Up Camera (RGB)</div>
    <div class="cam-fps" id="camFps">-- fps</div>
    <div class="cam-paused-overlay" id="camPausedOverlay">⏸ STREAM PAUSED</div>
    <button class="cam-toggle" id="camToggle">⏸ Pause</button>
  </div>

  <div class="speed-display">
    Linear: <span id="linVal">0.00</span> m/s &nbsp;
    Angular: <span id="angVal">0.00</span> rad/s
  </div>

  <div class="joystick-container" id="joystickZone">
    <div class="joystick-crosshair"></div>
    <div class="joystick-knob" id="knob"></div>
  </div>

  <div class="slider-row">
    <label>Max Speed</label>
    <input type="range" id="maxSpeed" min="0.05" max="1.0" step="0.05" value="0.3">
    <div class="val" id="maxSpeedVal">0.30</div>
  </div>
  <div class="slider-row">
    <label>Max Turn</label>
    <input type="range" id="maxTurn" min="0.1" max="2.0" step="0.1" value="0.8">
    <div class="val" id="maxTurnVal">0.80</div>
  </div>

  <div class="btn-row">
    <button class="btn btn-stop" id="btnStop">STOP</button>
  </div>

  <div class="btn-row">
    <button class="btn" id="btnFwd">Forward</button>
    <button class="btn" id="btnLeft">Left</button>
    <button class="btn" id="btnRight">Right</button>
    <button class="btn" id="btnBack">Back</button>
  </div>
</div>

<div class="log" id="log"></div>

<script>
// --- MQTT Credentials (from ESP32 project) ---
const MQTT_HOST  = 'wss://d0198e38be3049bd878bc42799f52885.s1.eu.hivemq.cloud:8884/mqtt';
const MQTT_USER  = 'hivemq.webclient.1773177445105';
const MQTT_PASS  = '15apW02MK,%A*gOdy;Tw';
const TOPIC_CMD  = 'robot/drive/cmd_vel';
const TOPIC_STAT = 'robot/imrp500/status';
const TOPIC_CAM  = 'robot/drive/camera';
const TOPIC_CAM_CTRL = 'robot/drive/camera_control';

const $  = id => document.getElementById(id);
const log = msg => { $('log').textContent = msg + '\n' + $('log').textContent.slice(0, 300); };

// --- MQTT ---
let mqttClient = null;
function connectMqtt() {
  const _mqtt = window.mqtt || (typeof mqtt !== 'undefined' ? mqtt : null);
  if (!_mqtt) {
    $('dotMqtt').className = 'status-dot dot-yellow';
    $('mqttStatus').textContent = 'Script Fail';
    log('MQTT.js script not loaded');
    return;
  }
  mqttClient = _mqtt.connect(MQTT_HOST, {
    username: MQTT_USER,
    password: MQTT_PASS,
    clientId: 'web-drive-' + Math.random().toString(16).slice(2, 8),
    reconnectPeriod: 3000,
    clean: true,
  });

  mqttClient.on('connect', () => {
    $('dotMqtt').className = 'status-dot dot-green';
    $('mqttStatus').textContent = 'connected';
    mqttClient.subscribe(TOPIC_STAT);
    mqttClient.subscribe(TOPIC_CAM, { qos: 0 });
    mqttClient.publish(TOPIC_CAM_CTRL, JSON.stringify({ stream: true }));
    log('MQTT connected');
  });

  mqttClient.on('error', e => {
    $('dotMqtt').className = 'status-dot dot-red';
    $('mqttStatus').textContent = 'error';
    log('MQTT error: ' + e.message);
  });

  mqttClient.on('offline', () => {
    $('dotMqtt').className = 'status-dot dot-yellow';
    $('mqttStatus').textContent = 'offline';
  });

  let camFrames = 0, camFpsTimer = setInterval(() => {
    $('camFps').textContent = camFrames + ' fps';
    camFrames = 0;
  }, 1000);

  let camStreaming = true;
  $('camToggle').addEventListener('click', () => {
    camStreaming = !camStreaming;
    const btn = $('camToggle');
    const overlay = $('camPausedOverlay');
    if (camStreaming) {
      btn.textContent = '⏸ Pause';
      btn.classList.remove('paused');
      overlay.classList.remove('visible');
    } else {
      btn.textContent = '▶ Resume';
      btn.classList.add('paused');
      overlay.classList.add('visible');
    }
  });

  mqttClient.on('message', (topic, msg) => {
    if (topic === TOPIC_CAM) {
      if (!camStreaming) return;
      const b64 = msg.toString();
      $('camImg').src = 'data:image/jpeg;base64,' + b64;
      camFrames++;
    } else if (topic === TOPIC_STAT) {
      log('Robot: ' + msg.toString());
    }
  });
}

// --- Send velocity ---
let lastSendTime = 0;
function sendVel(linear, angular) {
  const now = Date.now();
  if (now - lastSendTime < 80) return; // throttle to ~12Hz
  lastSendTime = now;

  linear  = Math.round(linear  * 100) / 100;
  angular = Math.round(angular * 100) / 100;

  $('linVal').textContent = linear.toFixed(2);
  $('angVal').textContent = angular.toFixed(2);

  if (mqttClient && mqttClient.connected) {
    mqttClient.publish(TOPIC_CMD, JSON.stringify({ linear, angular }));
  }
}

function stop() { sendVel(0, 0); lastSendTime = 0; sendVel(0, 0); }

// --- Joystick ---
const zone = $('joystickZone');
const knob = $('knob');
let dragging = false;

function getJoystickXY(e) {
  const rect = zone.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top  + rect.height / 2;
  const touch = e.touches ? e.touches[0] : e;
  let dx = touch.clientX - cx;
  let dy = touch.clientY - cy;
  const maxR = rect.width / 2 - 35;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if (dist > maxR) { dx = dx / dist * maxR; dy = dy / dist * maxR; }
  return { dx, dy, nx: dx / maxR, ny: -dy / maxR }; // ny inverted: up = positive
}

function onJoystickMove(e) {
  if (!dragging) return;
  e.preventDefault();
  const { dx, dy, nx, ny } = getJoystickXY(e);
  knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

  const maxLin = parseFloat($('maxSpeed').value);
  const maxAng = parseFloat($('maxTurn').value);
  sendVel(ny * maxLin, -nx * maxAng);
}

function onJoystickEnd() {
  dragging = false;
  knob.classList.remove('active');
  knob.style.transform = 'translate(-50%, -50%)';
  stop();
}

zone.addEventListener('mousedown',  e => { dragging = true; knob.classList.add('active'); onJoystickMove(e); });
zone.addEventListener('touchstart', e => { dragging = true; knob.classList.add('active'); onJoystickMove(e); }, { passive: false });
document.addEventListener('mousemove',  onJoystickMove);
document.addEventListener('touchmove',  onJoystickMove, { passive: false });
document.addEventListener('mouseup',    onJoystickEnd);
document.addEventListener('touchend',   onJoystickEnd);
document.addEventListener('touchcancel', onJoystickEnd);

// --- Buttons ---
$('btnStop').addEventListener('click', stop);

function holdBtn(btnId, lin, ang) {
  const btn = $(btnId);
  let interval = null;
  const start = () => { btn.classList.add('active'); sendVel(lin, ang); interval = setInterval(() => sendVel(lin, ang), 100); };
  const end   = () => { btn.classList.remove('active'); clearInterval(interval); stop(); };
  btn.addEventListener('mousedown',  start);
  btn.addEventListener('touchstart', e => { e.preventDefault(); start(); });
  btn.addEventListener('mouseup',    end);
  btn.addEventListener('mouseleave', end);
  btn.addEventListener('touchend',   end);
  btn.addEventListener('touchcancel', end);
}

const sp = () => parseFloat($('maxSpeed').value);
const tu = () => parseFloat($('maxTurn').value);
holdBtn('btnFwd',   0.2, 0);
holdBtn('btnBack', -0.2, 0);
holdBtn('btnLeft',  0, 0.5);
holdBtn('btnRight', 0, -0.5);

// --- Sliders ---
$('maxSpeed').addEventListener('input', e => $('maxSpeedVal').textContent = parseFloat(e.target.value).toFixed(2));
$('maxTurn').addEventListener('input',  e => $('maxTurnVal').textContent  = parseFloat(e.target.value).toFixed(2));

// --- Keyboard ---
const keys = {};
document.addEventListener('keydown', e => {
  if (keys[e.key]) return;
  keys[e.key] = true;
  updateKeyVel();
});
document.addEventListener('keyup', e => {
  delete keys[e.key];
  updateKeyVel();
});
function updateKeyVel() {
  let lin = 0, ang = 0;
  const s = parseFloat($('maxSpeed').value);
  const t = parseFloat($('maxTurn').value);
  if (keys['ArrowUp']    || keys['w']) lin += s;
  if (keys['ArrowDown']  || keys['s']) lin -= s;
  if (keys['ArrowLeft']  || keys['a']) ang += t;
  if (keys['ArrowRight'] || keys['d']) ang -= t;
  if (keys[' ']) { lin = 0; ang = 0; }
  sendVel(lin, ang);
}

// --- Start ---
connectMqtt();
</script>
</body>
</html>
